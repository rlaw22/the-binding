name: Deploy to Contabo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          cd /var/www/the-binding
          echo "=== Current directory: $(pwd) ==="
          echo "=== Downloading and running CSS fix script ==="
          curl -sL https://raw.githubusercontent.com/rlaw22/the-binding/main/fix-css.sh | bash
          echo "=== Installing dependencies ==="
          npm install --omit=dev
          echo "=== Restarting PM2 ==="
          pm2 restart the-binding
          echo "✅ Deployed successfully at $(date)"
