name: Deploy to Contabo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          cd /var/www/the-binding
          echo "=== Pulling latest code ==="
          git config --global --add safe.directory /var/www/the-binding
          git fetch origin main
          git reset --hard origin/main
          echo "=== Current commit ==="
          git log --oneline -1
          echo "=== Installing dependencies ==="
          npm install --omit=dev
          echo "=== Killing any orphaned processes on port 3000 ==="
          fuser -k 3000/tcp || true
          sleep 2
          echo "=== Restarting PM2 ==="
          pm2 delete the-binding || true
          pm2 start server.js --name the-binding
          pm2 save
          echo "=== Final status ==="
          pm2 list
          echo "✅ Deployed successfully at $(date)"
