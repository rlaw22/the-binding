  <title>The Binding — Northstar</title>
  <link rel="stylesheet" href="/src/storyline-v2-ui.css">
  <style>
    .northstar-app{min-height:100dvh;background:#120f0b;color:#e7d4a8;font-family:Georgia,serif}
    .northstar-top{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1500px;margin:auto;padding:14px clamp(16px,3vw,40px);color:#e0bd6a}
    .northstar-brand{font-size:clamp(1.1rem,2vw,1.7rem);letter-spacing:.16em;text-transform:uppercase}.northstar-kicker{color:#b99661;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
    .northstar-launch{max-width:620px;margin:12vh auto;padding:clamp(24px,5vw,56px);text-align:center;background:linear-gradient(135deg,#2d2117,#17120d);border:1px solid #b9954b88;box-shadow:0 22px 60px #0008}.northstar-launch h1{font-size:clamp(2rem,6vw,4.4rem);font-weight:normal;margin:.2em 0 .5em;color:#e0bd6a}.northstar-launch p{line-height:1.7;color:#d5bd8c}.northstar-form{display:grid;gap:14px;margin-top:28px;text-align:left}.northstar-form label{font-size:.82rem;color:#b99661;text-transform:uppercase;letter-spacing:.1em}.northstar-form select,.northstar-form button{font:inherit;padding:13px 15px;border:1px solid #b9954b99;background:#17120d;color:#e7d4a8}.northstar-form button{background:#b9954b;color:#17120d;cursor:pointer;font-weight:bold}.northstar-form button:hover,.northstar-form button:focus-visible{background:#e0bd6a}.northstar-error{color:#e98b78;min-height:1.4em}.northstar-status{color:#b99661;font-size:.85rem;min-height:1.4em}
    .northstar-game{display:none;max-width:1500px;margin:auto;padding:0 clamp(12px,2vw,32px) 32px}.northstar-game.active{display:block}.northstar-hud{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 12px;padding:10px 14px;border:1px solid #b9954b55;background:#292117;color:#e0bd6a}.northstar-hud strong{font-weight:normal}.northstar-hud small{color:#b99661}.northstar-book{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:min(780px,calc(100dvh - 150px));border:10px solid #120f0b;border-radius:10px;overflow:hidden;background:#292117;box-shadow:0 24px 70px #0009,inset 0 0 0 1px #b9954b}.northstar-page{padding:clamp(22px,4vw,60px);background:linear-gradient(100deg,#d5bd8c,#e7d4a8 48%,#c9aa72);color:#302417}.northstar-page + .northstar-page{border-left:1px solid #30241766}.northstar-page h2{font-size:clamp(1.2rem,2vw,1.8rem);font-weight:normal;margin:0 0 18px}.northstar-meta{color:#705532;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:28px}.northstar-narrative{max-width:68ch;font-size:clamp(1.05rem,1.35vw,1.25rem);line-height:1.8}.northstar-narrative p{margin:0 0 1em}.northstar-response{margin-top:24px;padding:14px 16px;border:1px solid #80663d;background:#f0dfb866;line-height:1.6}.northstar-response strong{display:block;margin-bottom:8px;color:#705532;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}.northstar-response-entry{padding:8px 0;border-top:1px solid #80663d55}.northstar-response-entry:first-of-type{border-top:0}.northstar-actions{display:grid;gap:12px}.northstar-action{width:100%;padding:15px;text-align:left;font:inherit;color:#302417;background:#f0dfb8cc;border:1px solid #80663d;cursor:pointer;box-shadow:0 3px 0 #80663d}.northstar-action:hover,.northstar-action:focus-visible{background:#fff0c9;outline:2px solid #302417;outline-offset:3px}.northstar-action small{display:block;color:#705532;margin-top:4px}.northstar-text-intent{margin-top:18px;padding-top:16px;border-top:1px solid #80663d}.northstar-text-intent label{display:block;color:#705532;font-size:.88rem;margin-bottom:7px}.northstar-text-row{display:flex;gap:8px}.northstar-text-row input{min-width:0;flex:1;padding:12px;font:inherit;color:#302417;background:#fff0c9;border:1px solid #80663d}.northstar-text-row button{padding:12px 14px;font:inherit;color:#f0dfb8;background:#302417;border:1px solid #302417;cursor:pointer}.northstar-text-row button:disabled{opacity:.55;cursor:wait}.northstar-text-feedback{min-height:1.4em;margin-top:8px;color:#705532;font-size:.9rem}.northstar-journal{margin-top:20px;padding-top:16px;border-top:1px solid #80663d}.northstar-journal summary{cursor:pointer;color:#705532}.northstar-journal article{padding:10px 0;border-bottom:1px solid #80663d55;font-size:.9rem;line-height:1.5}.northstar-back{background:none;border:0;color:#e0bd6a;cursor:pointer;font:inherit}

    @media(max-width:760px){.northstar-top{align-items:flex-start}.northstar-book{grid-template-columns:1fr;border-width:6px}.northstar-page + .northstar-page{border-left:0;border-top:1px solid #30241766}.northstar-page{padding:24px 18px}.northstar-game{padding:0 8px 20px}.northstar-hud{font-size:.82rem}.northstar-launch{margin:7vh 16px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="northstar-app">
    <header class="northstar-top"><div class="northstar-brand">The Binding</div><div class="northstar-kicker">The Binding</div></header>
    <section id="launch" class="northstar-launch" aria-labelledby="launch-title"><div class="northstar-kicker">A living book</div><h1 id="launch-title">Open Dracula</h1><p>Enter the private playtest and step into the newly ingested source-driven edition.</p><form id="launch-form" class="northstar-form"><label for="class-select">Choose your role</label><select id="class-select"><option value="fighter">Fighter</option><option value="rogue">Rogue</option><option value="wizard">Wizard</option><option value="cleric">Cleric</option></select><label for="token">Private access token</label><input id="token" type="password" autocomplete="off" required aria-describedby="token-help"><small id="token-help">Kept only in this browser tab; never placed in the URL.</small><button type="submit">Begin the journey</button><div id="launch-status" class="northstar-status" role="status"></div><div id="launch-error" class="northstar-error" role="alert"></div></form></section>
    <section id="game" class="northstar-game" aria-live="polite"><div class="northstar-hud"><strong id="scene-label">Dracula</strong><small id="scene-progress">Private canary</small><button id="leave" class="northstar-back" type="button">Return to shelf</button></div><div class="northstar-book"><article class="northstar-page"><div class="northstar-meta" id="scene-meta">Chapter I</div><h2 id="scene-title">Opening the book…</h2><div id="narrative" class="northstar-narrative"></div><div id="response" class="northstar-response" aria-live="polite" hidden></div></article><aside class="northstar-page"><div class="northstar-meta">What will you do?</div><div id="actions" class="northstar-actions"></div><form id="text-intent-form" class="northstar-text-intent"><label for="text-intent">Or describe what you do</label><div class="northstar-text-row"><input id="text-intent" name="text" type="text" maxlength="280" autocomplete="off" placeholder="What do you do?" aria-describedby="text-intent-feedback"><button id="text-intent-submit" type="submit">Send</button></div><div id="text-intent-feedback" class="northstar-text-feedback" role="status" aria-live="polite"></div></form><details class="northstar-journal"><summary>Journal / reading history</summary><div id="journal"></div></details></aside></div></section>
  </main>
