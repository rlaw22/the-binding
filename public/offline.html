<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <title>The Binding — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1A1A2E;
      color: #E0D6C8;
      font-family: 'Georgia', 'Times New Roman', serif;
      text-align: center;
      padding: 2rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }

    h1 {
      font-size: 1.8rem;
      color: #C9A84C;
      margin-bottom: 0.75rem;
      font-weight: normal;
      letter-spacing: 0.05em;
    }

    .status {
      font-size: 1.2rem;
      color: #A09888;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 400px;
      color: #A09888;
      margin-bottom: 2rem;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A84C, transparent);
      margin: 1.5rem 0;
    }

    button {
      background: transparent;
      border: 1px solid #C9A84C;
      color: #C9A84C;
      padding: 0.6rem 2rem;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      min-height: 44px;
      touch-action: manipulation;
    }

    button:hover, button:active {
      background: #C9A84C;
      color: #1A1A2E;
    }

    /* Saved session indicator */
    #saved-session {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      border: 1px solid #C9A84C40;
      border-radius: 8px;
      max-width: 400px;
      background: #C9A84C08;
    }
    #saved-session .session-icon { font-size: 1.2em; margin-right: 6px; }
    #saved-session .session-name { color: #C9A84C; font-weight: 600; }
    #saved-session .session-hint { color: #A09888; font-size: 0.9em; margin-top: 4px; }
    #saved-session .session-actions {
      display: flex; gap: 0.75rem; justify-content: center; margin-top: 0.75rem;
    }
    #saved-session .session-actions button {
      padding: 0.5rem 1.5rem; font-size: 0.9em;
    }
    #saved-session .btn-primary {
      background: #C9A84C; color: #1A1A2E; border: none;
    }

    /* Rejoin banner (from SW) */
    #rejoinBanner {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      border: 1px solid #C9A84C40;
      border-radius: 4px;
      max-width: 400px;
    }
    #rejoinBanner p { color: #C9A84C; margin-bottom: 0.75rem; font-size: 1rem; }
    #rejoinBanner .btn-row { display: flex; gap: 0.75rem; justify-content: center; }
    #rejoinBanner button { padding: 0.5rem 1.5rem; }
    #rejoinBanner #rejoinBtn { background: #C9A84C; color: #1A1A2E; border: none; }
    #rejoinBanner #dismissBtn { background: transparent; border: 1px solid #555; color: #888; }

    /* Connection status */
    .conn-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.85em; color: #A09888; margin-bottom: 1rem;
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .conn-dot.offline { background: #e74c3c; }
    .conn-dot.checking { background: #E8A838; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    .footer {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 0.1em;
    }

    /* Mobile responsive */
    @media (max-width: 500px) {
      body { padding: 1.5rem 1rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
      .icon { font-size: 3rem; }
      h1 { font-size: 1.4rem; }
      p { font-size: 1rem; }
      #saved-session, #rejoinBanner { max-width: 100%; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 1.2rem; letter-spacing: 0.02em; }
      .icon { font-size: 2.5rem; }
      button { padding: 0.5rem 1.5rem; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="icon">📖</div>
  <h1>You're offline</h1>
  <div class="conn-status">
    <span class="conn-dot offline" id="conn-dot"></span>
    <span id="conn-text">No connection</span>
  </div>
  <div class="divider"></div>
  <p class="status">Waiting to reconnect...</p>
  <p>Your story will continue once your connection is restored.</p>
  <button id="retryBtn" onclick="window.location.reload()">Retry</button>

  <!-- Saved session indicator (shown from localStorage) -->
  <div id="saved-session">
    <p><span class="session-icon">⚔️</span> <span class="session-name" id="saved-char-name">Adventurer</span></p>
    <p class="session-hint">Your adventure is saved locally. It will resume when you reconnect.</p>
    <div class="session-actions">
      <button class="btn-primary" id="saved-rejoin-btn">Rejoin</button>
      <button id="saved-dismiss-btn">Dismiss</button>
    </div>
  </div>

  <!-- Session rejoin banner (hidden by default, shown by JS if SW session found) -->
  <div id="rejoinBanner">
    <p>You have an active adventure waiting.</p>
    <div class="btn-row">
      <button id="rejoinBtn">Rejoin</button>
      <button id="dismissBtn">Dismiss</button>
    </div>
  </div>

  <div class="footer">THE BINDING · A TEXT ADVENTURE</div>

  <script>
    // ── Check localStorage for saved session ─────────────────────────
    (function() {
      try {
        var raw = localStorage.getItem('binding_session');
        if (raw) {
          var data = JSON.parse(raw);
          // Check if not expired (24 hours)
          if (data.sessionId && data.savedAt && (Date.now() - data.savedAt < 24 * 60 * 60 * 1000)) {
            var savedDiv = document.getElementById('saved-session');
            var nameSpan = document.getElementById('saved-char-name');
            nameSpan.textContent = data.characterName || 'Adventurer';
            savedDiv.style.display = 'block';

            document.getElementById('saved-rejoin-btn').addEventListener('click', function() {
              window.location.href = '/?session=' + encodeURIComponent(data.sessionId);
            });
            document.getElementById('saved-dismiss-btn').addEventListener('click', function() {
              savedDiv.style.display = 'none';
              try { localStorage.removeItem('binding_session'); } catch(e) {}
            });
          }
        }
      } catch(e) {}
    })();

    // ── Session Rejoin from Service Worker ───────────────────────────
    (function() {
      var rejoinBanner = document.getElementById('rejoinBanner');
      var rejoinBtn = document.getElementById('rejoinBtn');
      var dismissBtn = document.getElementById('dismissBtn');

      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'CHECK_REJOIN' });
      }

      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'REJOIN_INFO' && event.data.sessionId) {
          rejoinBanner.style.display = 'block';
          rejoinBtn.setAttribute('data-session-id', event.data.sessionId);
          rejoinBtn.setAttribute('data-session-url', event.data.sessionUrl || '');
        }
        if (event.data && event.data.type === 'RECONNECTED') {
          window.location.reload();
        }
      });

      if (rejoinBtn) {
        rejoinBtn.addEventListener('click', function() {
          var sid = rejoinBtn.getAttribute('data-session-id');
          var surl = rejoinBtn.getAttribute('data-session-url');
          if (surl) { window.location.href = surl; }
          else if (sid) { window.location.href = '/?session=' + encodeURIComponent(sid); }
          else { window.location.reload(); }
        });
      }
      if (dismissBtn) {
        dismissBtn.addEventListener('click', function() {
          rejoinBanner.style.display = 'none';
        });
      }
    })();

    // ── Connection monitoring ────────────────────────────────────────
    var connDot = document.getElementById('conn-dot');
    var connText = document.getElementById('conn-text');

    function checkConnection() {
      connDot.className = 'conn-dot checking';
      connText.textContent = 'Checking...';
      fetch('/manifest.json', { method: 'HEAD', cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            connDot.className = 'conn-dot';
            connDot.style.background = '#2ecc71';
            connText.textContent = 'Connected! Reloading...';
            setTimeout(function() { window.location.reload(); }, 500);
          } else {
            connDot.className = 'conn-dot offline';
            connText.textContent = 'No connection';
          }
        })
        .catch(function() {
          connDot.className = 'conn-dot offline';
          connText.textContent = 'No connection';
        });
    }

    window.addEventListener('online', function() { checkConnection(); });
    setInterval(checkConnection, 15000);
    // Initial check after 3s
    setTimeout(checkConnection, 3000);
  </script>
</body>
</html>
