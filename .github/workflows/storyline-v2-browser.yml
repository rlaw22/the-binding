name: Storyline V2 browser validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storyline-v2-browser.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - 'public/**'
      - 'src/storyline-v2/**'
      - 'src/api/**'
      - 'server.js'
      - 'tests/storyline-v2-*.test.js'
      - 'tests/uxui-*.test.js'

permissions:
  contents: read

jobs:
  browser:
    name: Node 20 Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - smoke
          - desktop
          - iphone-15-pro
          - ipad-portrait

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run V2 server-side regression
        run: npm test

      - name: Run browser project
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
