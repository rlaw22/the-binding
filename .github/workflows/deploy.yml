name: Deploy to Contabo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          cd /var/www/the-binding
          git pull origin main
          npm install --omit=dev
          # The public HTTPS V2 route runs from the isolated V2 checkout on
          # port 3100. Keep its runtime environment/data, but deploy the same
          # committed application and assets that were just pulled here.
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='data/' \
            --exclude='node_modules/' \
            /var/www/the-binding/ /var/www/the-binding-v2/
          cd /var/www/the-binding-v2
          npm install --omit=dev
          if pm2 describe the-binding >/dev/null 2>&1; then
            pm2 restart the-binding
          else
            pm2 start /var/www/the-binding/server.js --name the-binding
          fi
          if pm2 describe the-binding-v2 >/dev/null 2>&1; then
            pm2 restart the-binding-v2
          else
            pm2 start /var/www/the-binding-v2/server.js --name the-binding-v2
          fi
          pm2 save
          echo "✅ Deployed successfully at $(date)"

    - name: Verify public deployment health
      shell: bash
      run: |
        set -euo pipefail
        health_url="https://thebinding.duckdns.org/api/health"
        v2_url="https://thebinding.duckdns.org/api/storyline-v2/status"
        health="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$health_url")"
        v2="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$v2_url")"
        echo "Health response: $health"
        echo "V2 status response: $v2"
        grep -q '"status":"ok"' <<< "$health"
        grep -q '"enabled":false' <<< "$v2"
        echo "✅ Public health is OK and Storyline V2 remains disabled"
